server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://perk-server:3001/api/;
        proxy_set_header Host $host;
    }

    location /perks/ {
        proxy_pass http://perk-server:3001/perks/;
        proxy_set_header Host $host;
    }

    # WebSocket upgrade - this is also the address Rainmeter connects to,
    # e.g. ws://yourdomain:8080/ws?room=CODE
    # Timeouts extended past nginx's 60s default: the server now pings
    # every 25s to keep the connection active regardless, but this is a
    # backstop in case that's ever not enough.
    location /ws {
        proxy_pass http://perk-server:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback: client-side routes like /ABCDE aren't real files
    location / {
        try_files $uri $uri/ /index.html;
    }
}
