[Rainmeter]
Update=1000
BackgroundMode=1
DynamicWindowSize=1

; Set this per-install, or turn it into a proper Settings section later
; (e.g. read from a Variables.inc file so you're not editing the skin
; itself every time you join a new lobby).
[Variables]
RoomCode=6D5YT
ServerAddress=ws://127.0.0.1:8080/ws

[WebSocketMeasure]
Measure=Plugin
Plugin=DbdPerkSocket.dll
Address=#ServerAddress#?room=#RoomCode#
CacheFolder=#CURRENTPATH#Cache\
OnConnect=[!Log "DBD perk sync: connected7"]
OnMessage=[!Log "DBD perk sync: perks updated"]
OnDisconnect=[!Log "DBD perk sync: disconnected, retrying"]

; No WebParser measures anymore - the plugin caches each perk's image to
; CacheFolder itself and pushes the local path straight into ImageName
; below whenever a message arrives (see HandleMessage in the plugin).
; Nothing here needs DynamicVariables either, since ImageName is being
; set as a literal path by the plugin, not read as a live reference.

[Perk1Image]
Meter=Image
X=0
Y=0
W=128
H=128

[Perk2Image]
Meter=Image
X=5R
Y=0r
W=128
H=128

[Perk3Image]
Meter=Image
X=5R
Y=0r
W=128
H=128

[Perk4Image]
Meter=Image
X=5R
Y=0r
W=128
H=128