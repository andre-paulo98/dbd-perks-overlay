[Rainmeter]
Update=1000
BackgroundMode=1
DynamicWindowSize=1

; Set this per-install, or turn it into a proper Settings section later
; (e.g. read from a Variables.inc file so you're not editing the skin
; itself every time you join a new lobby).
[Variables]
RoomCode=6D5YT
ServerAddress=ws://127.0.0.1:8080/ws

[WebSocketMeasure]
Measure=Plugin
Plugin=DbdPerkSocket.dll
Address=#ServerAddress#?room=#RoomCode#
OnConnect=[!Log "DBD perk sync: connected6"]
OnMessage=[!Log "DBD perk sync: perks updated"]
OnDisconnect=[!Log "DBD perk sync: disconnected, retrying"]

[Perk1Download]
Measure=WebParser
Url=""
Download=1
FinishAction=[!UpdateMeter Perk1Image][!Redraw]

[Perk1Image]
Meter=Image
MeasureName=Perk1Download
X=0
Y=0
W=128
H=128

[Perk2Download]
Measure=WebParser
Url=""
Download=1
FinishAction=[!UpdateMeter Perk2Image][!Redraw]

[Perk2Image]
Meter=Image
MeasureName=Perk2Download
X=5R
Y=0r
W=128
H=128

