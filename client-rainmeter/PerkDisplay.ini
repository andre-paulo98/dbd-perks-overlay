[Rainmeter]
Update=1000
BackgroundMode=1
DynamicWindowSize=1
; Lets clicks pass through to whatever's behind the skin (e.g. the game)
; by default - hold Ctrl and left-click to interact with the skin itself.
; (Ctrl+right-click is reserved by Rainmeter for its own context menu even
; in click-through mode, which is why the room-switch trigger below uses
; left-click, not right-click.)
ClickThrough=1

; No RoomCode variable anymore - it's entered on-skin now (see below).
; Size controls the perk grid's scale - 100 is the default/original size,
; 50 is half size, 150 is 1.5x, etc. Nothing else in the ini needs to
; change; the derived variables below do the actual scaling math.
[Variables]
ServerAddress=wss://dbdperks.overlay.andrepaulo.me/ws
Size=100
; Diamond layout matching DBD's own loadout display: one perk on top,
; two in the middle row, one on bottom. GridStep is the horizontal gap
; between the middle pair; RowStep is the vertical gap between rows -
; kept smaller than GridStep on purpose, so top/bottom pull in and
; overlap the middle row's diamond shapes rather than sitting apart from
; them. If it's not quite tight enough (or too tight), RowStep alone is
; the number to adjust - smaller pulls rows closer, larger spreads them out.
IconSize=(128*#Size#/100)
GridStep=(133*#Size#/100)
CenterX=(66.5*#Size#/100)
RowStep=(80*#Size#/100)
BottomY=(160*#Size#/100)

[WebSocketMeasure]
Measure=Plugin
Plugin=DbdPerkSocket.dll
Address=#ServerAddress#
CacheFolder=#CURRENTPATH#Cache\
OnConnect=[!Log "DBD perk sync: connected"]
OnMessage=[!Log "DBD perk sync: perks updated"]
OnDisconnect=[!Log "DBD perk sync: disconnected, retrying"]

; --- Room code entry ---------------------------------------------------
; RoomBox and the input box are stacked vertically (never overlapping) -
; click RoomBox (Ctrl+click if ClickThrough is on) to get the input box
; just below it. Type a code, press Enter; the plugin checks the server
; before connecting. Once connected, both hide and the perk grid takes
; their place - Ctrl+click any perk slot to bring them back.

[RoomBox]
Meter=String
X=0
Y=0
W=240
H=26
SolidColor=30,30,35,255
FontFace=Segoe UI
FontSize=10
FontColor=200,200,210,255
StringAlign=Left
ClipString=1
Text=[WebSocketMeasure:Status()]
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureRoomInput "ExecuteBatch 1"]
ToolTipText=Click to enter or change the room code

[MeasureRoomInput]
Measure=Plugin
Plugin=InputText
X=0
Y=34
W=240
H=24
FontFace=Segoe UI
FontSize=11
FontColor=255,255,255,255
SolidColor=30,30,35,255
StringAlign=Left
DefaultValue=Enter room code
FocusDismiss=1
Command1=[!CommandMeasure WebSocketMeasure "SetRoom $UserInput$"]

; --- Perk display --------------------------------------------------------
; Diamond layout (top / middle-left / middle-right / bottom), hidden
; until a room connects. Left-click (not right-click - see the
; ClickThrough note up top) any slot to bring RoomBox back and switch
; rooms. No WebParser measures needed - the plugin caches each perk's
; image itself and pushes the local path straight into ImageName.

[Perk1Image]
; Top
Meter=Image
Group=Perks
Hidden=1
X=#CenterX#
Y=0
W=#IconSize#
H=#IconSize#
LeftMouseUpAction=[!CommandMeasure WebSocketMeasure "ShowRoomInput"]
ToolTipText=Click to change room

[Perk2Image]
; Middle-left
Meter=Image
Group=Perks
Hidden=1
X=0
Y=#RowStep#
W=#IconSize#
H=#IconSize#
LeftMouseUpAction=[!CommandMeasure WebSocketMeasure "ShowRoomInput"]
ToolTipText=Click to change room

[Perk3Image]
; Middle-right
Meter=Image
Group=Perks
Hidden=1
X=#GridStep#
Y=#RowStep#
W=#IconSize#
H=#IconSize#
LeftMouseUpAction=[!CommandMeasure WebSocketMeasure "ShowRoomInput"]
ToolTipText=Click to change room

[Perk4Image]
; Bottom
Meter=Image
Group=Perks
Hidden=1
X=#CenterX#
Y=#BottomY#
W=#IconSize#
H=#IconSize#
LeftMouseUpAction=[!CommandMeasure WebSocketMeasure "ShowRoomInput"]
ToolTipText=Click to change room